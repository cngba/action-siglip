# ==============================================================================
# 3. CÁC MODE HUẤN LUYỆN
# ==============================================================================
modes:

  # ---------------------------------------------------------
  # BASELINE 1: NO LORA (Frozen Base + Train Custom Heads)
  # ---------------------------------------------------------

  baseline_with_lora:
    checkpoint_dir: "./exp/siglip2_peft/ssv2/baseline_with_lora"
    log_file: "./exp/siglip2_peft/ssv2/baseline_with_lora/session.log"
    
    unfreeze_backbone: false
    prompt_type: "manual"
    manual_prompt_template: "a video of a person {}"
    cocoop_hidden_dim: 512
    
    lora_r: 16                   
    lora_alpha: 16.0            
    lora_dropout: 0.05          
    lora_target_modules: ["q_proj", "v_proj"]

    batch_size: 32              
    accumulation_steps: 1       
    
    lr_base: 5.0e-5             
    lr_head: 1.0e-3             
    weight_decay: 0.05          
    
    num_epochs: 12              
    warmup_epochs: 2            
    early_stopping_patience: 3  

  zero_shot_baseline_with_lora:
    checkpoint_dir: "./exp/siglip2_peft/ssv2/baseline_with_lora" 
    
    unfreeze_backbone: false
    prompt_type: "manual"
    manual_prompt_template: "a video of a person {}"
    cocoop_hidden_dim: 512
    
    lora_r: 16                   
    lora_alpha: 16.0            
    lora_dropout: 0.05          
    lora_target_modules: ["q_proj", "v_proj"]

    batch_size: 32