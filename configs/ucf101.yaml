# ==============================================================================
# Global Configuration (Shared across all execution pipelines)
# ==============================================================================
model_name: "google/siglip2-base-patch16-224"
seed: 1024

data:
  dataset: "ucf101"
  num_classes: 101
  num_segments: 8
  base_dir: "C:\\Users\\CONG\\source\\data\\UCF101\\UCF-101"
  annotation_dir: "C:\\Users\\CONG\\source\\data\\ucfTrainTestlist"
  split: 1                                  
  workers: 1

# ==============================================================================
# Mode Matrices (Train, Zero-Shot, and Specific Ablations)
# ==============================================================================
modes:
  # 1. Standard PEFT Baseline with Manual Text Prompts
  train_full_peft:
    checkpoint_dir: "./exp/siglip2_peft/ucf101/full_peft"
    log_file: "./exp/siglip2_peft/ucf101/full_peft/session.log"
    batch_size: 32
    num_epochs: 1
    lr: 5.e-5
    weight_decay: 0.01
    # Prompt Configuration
    prompt_type: "manual"
    manual_prompt_template: "A video of a person performing {}"
    cocoop_hidden_dim: 512
    # LoRA Configuration
    lora_r: 4
    lora_alpha: 8.0
    lora_dropout: 0.05
    lora_target_modules: ["q_proj", "v_proj"]

  # 2. CoCoOp Prompt Learning Ablation
  ablation_cocoop:
    checkpoint_dir: "./exp/siglip2_peft/ucf101/cocoop"
    log_file: "./exp/siglip2_peft/ucf101/cocoop/session.log"
    batch_size: 32
    num_epochs: 1
    lr: 5.e-5
    weight_decay: 0.01
    # Prompt Configuration
    prompt_type: "cocoop"
    manual_prompt_template: "A video of a person performing {}"
    cocoop_hidden_dim: 512
    # LoRA Configuration
    lora_r: 4
    lora_alpha: 8.0
    lora_dropout: 0.05
    lora_target_modules: ["q_proj", "v_proj"]

  # 3. High-Rank LoRA Ablation (All Projections)
  ablation_lora_r16_all:
    checkpoint_dir: "./exp/siglip2_peft/ucf101/lora_r16_all"
    log_file: "./exp/siglip2_peft/ucf101/lora_r16_all/session.log"
    batch_size: 32
    num_epochs: 1
    lr: 5.e-5
    weight_decay: 0.01
    # Prompt Configuration
    prompt_type: "manual"
    manual_prompt_template: "A video of a person performing {}"
    cocoop_hidden_dim: 512
    # LoRA Configuration
    lora_r: 16
    lora_alpha: 32.0
    lora_dropout: 0.1
    lora_target_modules: ["q_proj", "k_proj", "v_proj", "out_proj"]