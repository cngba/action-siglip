# configs/ssv2_fewshot.yaml

# ==============================================================================
# Global Configuration 
# ==============================================================================
model_name: "google/siglip2-base-patch16-224"
seed: 1234

# ==============================================================================
# 1. CẤU HÌNH DỮ LIỆU (VISION BRANCH)
# ==============================================================================
data:
  dataset: "ssv2"
  base_dir: "/root/data/20bn-something-something-v2"                  # Location containing *.webm files
  annotation_dir: "/root/data/labels"     # Location containing labels.json, train.json, validation.json
  split: 1                                # Ignored for SSv2
  num_segments: 8
  workers: 8
  
  # --- THÊM CONFIG CHO CHẾ ĐỘ BASE-TO-NOVEL TẠI ĐÂY ---
  setting: "few_shot"                      # Chuyển mode thành base2novel
  splits_dir: "/root/action-siglip/datasets_splits/ssv2_splits"    # Thư mục chứa 3 file .txt của tc-clip
  train_few_shot: "train1_few_shot_2.txt"
  val_few_shot: "validation.txt"

# ==============================================================================
# 3. CÁC MODE HUẤN LUYỆN (Giữ nguyên như code của bạn)
# ==============================================================================
modes:

  baseline_with_lora_2:
    checkpoint_dir: "./exp/siglip2_peft/ssv2/baseline_with_lora_2"
    log_file: "./exp/siglip2_peft/ssv2/baseline_with_lora_2/session.log"
    
    unfreeze_backbone: false
    prompt_type: "manual"
    manual_prompt_template: "a video of a person {}"
    cocoop_hidden_dim: 512
    
    lora_r: 16                   
    lora_alpha: 16.0            
    lora_dropout: 0.05          
    lora_target_modules: ["q_proj", "v_proj"]

    batch_size: 32              
    accumulation_steps: 2       
    
    lr_base: 3.0e-4             
    lr_head: 2.0e-3             
    weight_decay: 0.05          
    
    num_epochs: 50              
    warmup_epochs: 5            
    early_stopping_patience: 5

  baseline_with_lora_4:
