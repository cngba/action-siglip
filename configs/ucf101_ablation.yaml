# ==============================================================================
# Global Configuration (Shared across all execution pipelines)
# ==============================================================================
model_name: "google/siglip2-base-patch16-224"
seed: 1024

data:
  dataset: "ucf101"
  num_classes: 101
  num_segments: 8
  base_dir: "/root/data/UCF-101"
  annotation_dir: "/root/data/ucfTrainTestlist"
  split: 1                                  
  workers: 8

# ==============================================================================
# Mode Matrices cho LoRA Ablation Study (Chỉ tập trung vào Attention)
# Cố định: lr_base=1.0e-4, lr_head=1.0e-3, weight_decay=0.05, batch_size=32
# ==============================================================================
modes:
  # ---------------------------------------------------------
  # BASELINE LORA (r=8, alpha=16, targets=[q_proj, v_proj], dropout=0.05)
  # ---------------------------------------------------------
  ablation_lora_baseline:
    checkpoint_dir: "./exp/siglip2_peft/ucf101/ablation_lora_baseline"
    log_file: "./exp/siglip2_peft/ucf101/ablation_lora_baseline/session.log"
    unfreeze_backbone: false
    prompt_type: "manual"
    manual_prompt_template: "A video of a person performing {}"
    cocoop_hidden_dim: 512
    lora_r: 8
    lora_alpha: 16.0
    lora_dropout: 0.05
    lora_target_modules: ["q_proj", "v_proj"]
    batch_size: 32
    accumulation_steps: 1
    lr_base: 1.0e-4
    lr_head: 1.0e-3
    weight_decay: 0.05
    num_epochs: 10
    early_stopping_patience: 3

  # ---------------------------------------------------------
  # 1. ABLATION TRÊN RANK (r)
  # ---------------------------------------------------------
  ablation_lora_r_4:
    checkpoint_dir: "./exp/siglip2_peft/ucf101/ablation_lora_r_4"
    log_file: "./exp/siglip2_peft/ucf101/ablation_lora_r_4/session.log"
    unfreeze_backbone: false
    prompt_type: "manual"
    manual_prompt_template: "A video of a person performing {}"
    cocoop_hidden_dim: 512
    lora_r: 4                   # Giảm rank
    lora_alpha: 16.0
    lora_dropout: 0.05
    lora_target_modules: ["q_proj", "v_proj"]
    batch_size: 32
    accumulation_steps: 1
    lr_base: 1.0e-4
    lr_head: 1.0e-3
    weight_decay: 0.05
    num_epochs: 10
    early_stopping_patience: 3

    ablation_lora_r_16:
      checkpoint_dir: "./exp/siglip2_peft/ucf101/ablation_lora_r_16"
      log_file: "./exp/siglip2_peft/ucf101/ablation_lora_r_16/session.log"
      unfreeze_backbone: false
      prompt_type: "manual"
      manual_prompt_template: "A video of a person performing {}"
      cocoop_hidden_dim: 512
      lora_r: 16                  # Tăng rank
      lora_alpha: 16.0
      lora_dropout: 0.05
      lora_target_modules: ["q_proj", "v_proj"]
      batch_size: 32
      accumulation_steps: 1
      lr_base: 1.0e-4
      lr_head: 1.0e-3
      weight_decay: 0.05
      num_epochs: 10
      early_stopping_patience: 3

  # ---------------------------------------------------------
  # 2. ABLATION TRÊN ALPHA (SCALING)
  # ---------------------------------------------------------
  ablation_lora_alpha_8:
    checkpoint_dir: "./exp/siglip2_peft/ucf101/ablation_lora_alpha_8"
    log_file: "./exp/siglip2_peft/ucf101/ablation_lora_alpha_8/session.log"
    unfreeze_backbone: false
    prompt_type: "manual"
    manual_prompt_template: "A video of a person performing {}"
    cocoop_hidden_dim: 512
    lora_r: 8
    lora_alpha: 8.0             # Scale = 1x
    lora_dropout: 0.05
    lora_target_modules: ["q_proj", "v_proj"]
    batch_size: 32
    accumulation_steps: 1
    lr_base: 1.0e-4
    lr_head: 1.0e-3
    weight_decay: 0.05
    num_epochs: 10
    early_stopping_patience: 3

  ablation_lora_alpha_32:
    checkpoint_dir: "./exp/siglip2_peft/ucf101/ablation_lora_alpha_32"
    log_file: "./exp/siglip2_peft/ucf101/ablation_lora_alpha_32/session.log"
    unfreeze_backbone: false
    prompt_type: "manual"
    manual_prompt_template: "A video of a person performing {}"
    cocoop_hidden_dim: 512
    lora_r: 8
    lora_alpha: 32.0            # Scale = 4x
    lora_dropout: 0.05
    lora_target_modules: ["q_proj", "v_proj"]
    batch_size: 32
    accumulation_steps: 1
    lr_base: 1.0e-4
    lr_head: 1.0e-3
    weight_decay: 0.05
    num_epochs: 10
    early_stopping_patience: 3

  # ---------------------------------------------------------
  # 3. ABLATION TRÊN TARGET MODULES
  # ---------------------------------------------------------
  ablation_lora_targets_all_attn:
    checkpoint_dir: "./exp/siglip2_peft/ucf101/ablation_lora_targets_all_attn"
    log_file: "./exp/siglip2_peft/ucf101/ablation_lora_targets_all_attn/session.log"
    unfreeze_backbone: false
    prompt_type: "manual"
    manual_prompt_template: "A video of a person performing {}"
    cocoop_hidden_dim: 512
    lora_r: 8
    lora_alpha: 16.0
    lora_dropout: 0.05
    lora_target_modules: ["q_proj", "k_proj", "v_proj", "out_proj"] # Full Attention Matrix
    batch_size: 16
    accumulation_steps: 2
    lr_base: 1.0e-4
    lr_head: 1.0e-3
    weight_decay: 0.05
    num_epochs: 10
    early_stopping_patience: 3

  # ---------------------------------------------------------
  # 4. ABLATION TRÊN DROPOUT
  # ---------------------------------------------------------
  ablation_lora_dropout_0.0:
    checkpoint_dir: "./exp/siglip2_peft/ucf101/ablation_lora_dropout_0.0"
    log_file: "./exp/siglip2_peft/ucf101/ablation_lora_dropout_0.0/session.log"
    unfreeze_backbone: false
    prompt_type: "manual"
    manual_prompt_template: "A video of a person performing {}"
    cocoop_hidden_dim: 512
    lora_r: 8
    lora_alpha: 16.0
    lora_dropout: 0.0             # Bỏ hoàn toàn Dropout
    lora_target_modules: ["q_proj", "v_proj"]
    batch_size: 32
    accumulation_steps: 1
    lr_base: 1.0e-4
    lr_head: 1.0e-3
    weight_decay: 0.05
    num_epochs: 10
    early_stopping_patience: 3

  ablation_lora_dropout_0.1:
    checkpoint_dir: "./exp/siglip2_peft/ucf101/ablation_lora_dropout_0.1"
    log_file: "./exp/siglip2_peft/ucf101/ablation_lora_dropout_0.1/session.log"
    unfreeze_backbone: false
    prompt_type: "manual"
    manual_prompt_template: "A video of a person performing {}"
    cocoop_hidden_dim: 512
    lora_r: 8
    lora_alpha: 16.0
    lora_dropout: 0.1             # Tăng Dropout
    lora_target_modules: ["q_proj", "v_proj"]
    batch_size: 32
    accumulation_steps: 1
    lr_base: 1.0e-4
    lr_head: 1.0e-3
    weight_decay: 0.05
    num_epochs: 10
    early_stopping_patience: 3