# ==============================================================================
# Global Configuration 
# ==============================================================================
model_name: "google/siglip2-base-patch16-224"
seed: 1234

# ==============================================================================
# 1. CẤU HÌNH DỮ LIỆU (VISION BRANCH)
# ==============================================================================
data:
  dataset: "ucf101"
  num_classes: 101
  num_segments: 8
  base_dir: "/root/data/UCF-101"             # Thư mục chứa video gốc
  annotation_dir: "/root/data/ucfTrainTestlist" 
  split: 1
  workers: 8
  
  # --- THÊM CONFIG CHO CHẾ ĐỘ BASE-TO-NOVEL TẠI ĐÂY ---
  setting: "base2novel"                      # Chuyển mode thành base2novel
  splits_dir: "/root/action-siglip/datasets_splits/base2novel_splits/ucf_splits"    # Thư mục chứa 3 file .txt của tc-clip
  train_base: "base_train.txt"               # Dùng cho train.py
  # có thể chọn fs_base_s<id>_train.txt thay vì base_train.txt để chống overfit 
  val_base: "base_val.txt"                   # Dùng cho validation trong train.py
  val_novel: "novel_val.txt"                 # Dùng cho test.py (Zero-shot)

# ==============================================================================
