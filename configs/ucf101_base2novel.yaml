# ==============================================================================
# 3. CÁC MODE HUẤN LUYỆN (Giữ nguyên như code của bạn)
# ==============================================================================
modes:

  baseline_with_lora:
    checkpoint_dir: "./exp/siglip2_peft/ucf101/baseline_with_lora"
    log_file: "./exp/siglip2_peft/ucf101/baseline_with_lora/session.log"
    
    unfreeze_backbone: false
    prompt_type: "manual"
    manual_prompt_template: "a video of a person {}"
    cocoop_hidden_dim: 512
    
    lora_r: 16                   
    lora_alpha: 16.0            
    lora_dropout: 0.05          
    lora_target_modules: ["q_proj", "v_proj"]

    batch_size: 32              
    accumulation_steps: 1       
    
    lr_base: 5.0e-5             
    lr_head: 1.0e-3             
    weight_decay: 0.05          
    
    num_epochs: 12              
    warmup_epochs: 2            
    early_stopping_patience: 3  

  zero_shot_baseline_with_lora:
    # Trỏ về cùng thư mục để nó tìm thấy file log và ma trận nhầm lẫn (confusion matrix)
    checkpoint_dir: "./exp/siglip2_peft/ucf101/baseline_with_lora" 
    
    # Giữ nguyên cấu trúc mạng như lúc train để load weight không bị lỗi
    unfreeze_backbone: false
    prompt_type: "manual"
    manual_prompt_template: "a video of a person {}"
    cocoop_hidden_dim: 512
    
    lora_r: 16                   
    lora_alpha: 16.0            
    lora_dropout: 0.05          
    lora_target_modules: ["q_proj", "v_proj"]

    batch_size: 32           