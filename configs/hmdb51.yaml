# ==============================================================================
# Global Configuration (HMDB51)
# ==============================================================================
model_name: "google/siglip2-base-patch16-224"
seed: 1024

data:
  dataset: "hmdb51"
  num_classes: 51
  num_segments: 8
  
  # 1. TRỎ VÀO THƯ MỤC CHỨA 51 THƯ MỤC VIDEO CON (hành động)
  # Lưu ý: Nếu báo lỗi không tìm thấy file, hãy kiểm tra xem bên trong nó 
  # có bị lồng thêm 1 thư mục hmdb51_org nữa không (cấu trúc nén hay bị vậy).
  base_dir: "/root/.cache/kagglehub/datasets/easonlll/hmdb51/versions/1/hmdb51_org"
  
  # 2. TRỎ VÀO THƯ MỤC GỐC CHỨA CÁC FILE *_test_split1.txt
  annotation_dir: "/root/.cache/kagglehub/datasets/easonlll/hmdb51/versions/1/testTrainMulti_7030_splits/testTrainMulti_7030_splits"
  
  split: 1                                  
  workers: 8

# ==============================================================================
# ZERO-SHOT SPLITS (Chia 25 Seen / 26 Unseen cho HMDB51)
# ==============================================================================
zero_shot_splits:
  seen_class_names: [
    "brush_hair", "cartwheel", "catch", "chew", "clap", "climb", "climb_stairs", 
    "dive", "draw_sword", "dribble", "drink", "eat", "fall_floor", "fencing", 
    "flic_flac", "golf", "handstand", "hit", "hug", "jump", "kick", "kick_ball", 
    "kiss", "laugh", "pour"
  ]
  unseen_class_names: [
    "pullup", "punch", "push", "pushup", "ride_bike", "ride_horse", "run", 
    "shake_hands", "shoot_ball", "shoot_bow", "shoot_gun", "sit", "situp", 
    "smile", "smoke", "somersault", "stand", "swing_baseball", "sword", 
    "sword_exercise", "talk", "throw", "turn", "walk", "wave"
  ]

# ==============================================================================
# MODES MATRIX
# ==============================================================================
modes:
  # ---------------------------------------------------------
  # MODE 1: CROSS-DATASET ZSL (Lấy weights UCF101 test thẳng)
  # ---------------------------------------------------------
  cross_dataset_zsl:
    checkpoint_dir: "./exp/siglip2_peft/hmdb51/cross_dataset_zsl"
    log_file: "./exp/siglip2_peft/hmdb51/cross_dataset_zsl.log"
    
    unfreeze_backbone: false
    prompt_type: "manual"
    manual_prompt_template: "A video of a person performing {}"
    cocoop_hidden_dim: 512
    
    lora_r: 16
    lora_alpha: 16.0
    lora_dropout: 0.05
    lora_target_modules: ["q_proj","v_proj"]
    batch_size: 16

  # ---------------------------------------------------------
  # MODE 2: INTRA-DATASET ZSL - TRAIN (Học trên 25 class của HMDB51)
  # ---------------------------------------------------------
  train_hmdb_lora:
    checkpoint_dir: "./exp/siglip2_peft/hmdb51/train_hmdb_lora"
    log_file: "./exp/siglip2_peft/hmdb51/train_hmdb_lora.log"
    
    unfreeze_backbone: false
    prompt_type: "manual"
    manual_prompt_template: "A video of a person performing {}"
    cocoop_hidden_dim: 512
    
    lora_r: 16
    lora_alpha: 16.0
    lora_dropout: 0.05
    lora_target_modules: ["q_proj","v_proj"]

    batch_size: 32
    accumulation_steps: 1
    lr_base: 3.0e-4
    lr_head: 2.0e-3
    weight_decay: 0.1
    
    num_epochs: 50
    scheduler_t_max: 50
    early_stopping_patience: 8

  # ---------------------------------------------------------
  # MODE 3: INTRA-DATASET ZSL - TEST (Đánh giá trên 26 class Unseen của HMDB51)
  # ---------------------------------------------------------
  zero_shot_hmdb:
    checkpoint_dir: "./exp/siglip2_peft/hmdb51/train_hmdb_lora"
    log_file: "./exp/siglip2_peft/hmdb51/zero_shot_hmdb.log"
    
    unfreeze_backbone: false
    prompt_type: "manual"
    manual_prompt_template: "A video of a person performing {}"
    cocoop_hidden_dim: 512
    
    lora_r: 16
    lora_alpha: 16.0
    lora_dropout: 0.05
    lora_target_modules: ["q_proj","v_proj"]
    batch_size: 16